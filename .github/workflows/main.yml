name: Build Madeira IPA (PR 14)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR #14'ü orijinal repodan çeker
      - name: Checkout PR #14
        run: |
          git remote add upstream https://github.com/willfaust/Madeira.git
          git fetch upstream pull/14/head:pr-14
          git checkout pr-14
          git submodule update --init --recursive

      # Güncel bison, flex ve derleme araçlarını kurup sistem yoluna ekler
      - name: Install Dependencies & Setup Tools
        run: |
          brew install bison flex pkg-config cmake ninja meson llvm lld
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      # PR #14 tek komutlu derleyici betiğini çalıştırır
      - name: Run One-Command Build Script
        run: |
          chmod +x ./scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      # Çıkan IPA dosyasını Artifacts alanına yükler
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: dist/Madeira.ipa
          retention-days: 7
